<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>벽돌깨기 게임</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0a1230; color: #fff;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "Nanum Gothic", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 8px;
  }

  /* 상단 정보줄: 프로젝터에서도 보이도록 큰 글씨 */
  #hud {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
    gap: 4px 30px; width: 100%;
    font-size: clamp(20px, 2.7vw, 56px); font-weight: 700; line-height: 1.25;
  }
  #hud .stat b { color: #ffe14d; font-variant-numeric: tabular-nums; }
  #hud .hearts { color: #ff5c7a; letter-spacing: 0.05em; }
  #hud .hearts .off { color: #4a5380; }
  button { font-family: inherit; cursor: pointer; }
  #btnPause {
    font-size: 0.8em; font-weight: 700; padding: 0.1em 0.7em;
    border-radius: 0.5em; border: 3px solid #fff; background: #243a8f; color: #fff;
  }
  #btnPause:hover { background: #3350c4; }

  /* 난이도 선택 버튼 (상단 + 안내 화면 공용) */
  .diff { display: flex; align-items: center; gap: 0.45em; }
  .dgroup { display: flex; gap: 0.35em; }
  .dbtn {
    font-size: 0.8em; font-weight: 700; padding: 0.1em 0.7em;
    border-radius: 0.5em; border: 3px solid #fff; background: #243a8f; color: #fff;
  }
  .dbtn:hover { background: #3350c4; }
  .dbtn.on, .dbtn.on:hover { background: #ffe14d; border-color: #ffe14d; color: #1a1a1a; }

  #stage {
    position: relative; width: 960px; height: 600px;
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 0 0 4px #7aa2ff, 0 0 30px rgba(90, 140, 255, 0.5);
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* 안내·결과 화면 (글자 크기는 화면 크기에 맞춰 자동 확대) */
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.6em; padding: 1em; text-align: center;
    background: rgba(6, 12, 38, 0.88);
  }
  #overlay.hidden { display: none; }
  #ovTitle { margin: 0; font-size: 3.4em; line-height: 1.1; color: #ffe14d; text-shadow: 0 4px 0 rgba(0,0,0,0.4); }
  #ovText { margin: 0; font-size: 1.7em; line-height: 1.5; white-space: pre-line; }
  #ovDiff { display: flex; align-items: center; justify-content: center; gap: 0.5em; font-size: 1.7em; font-weight: 700; }
  #ovBtn {
    margin-top: 0.4em; font-size: 2.2em; font-weight: 700; padding: 0.25em 1.2em;
    border-radius: 0.6em; border: 4px solid #fff; background: #2fbf71; color: #fff;
    box-shadow: 0 0.15em 0 #1b7f4b;
  }
  #ovBtn:hover { background: #38d681; }
  #ovBtn:active { transform: translateY(0.08em); box-shadow: 0 0.07em 0 #1b7f4b; }
</style>
</head>
<body>

<div id="hud">
  <div class="stat">점수 <b id="score">0</b></div>
  <div class="stat">생명 <span class="hearts" id="lives"></span></div>
  <div class="stat">단계 <b id="level">1</b> / 3</div>
  <div class="stat">공 속도 <b id="speed">×1.0</b></div>
  <div class="diff"><span>난이도</span><div class="dgroup" id="hudDiff"></div></div>
  <button id="btnPause" type="button">일시정지</button>
</div>

<div id="stage">
  <canvas id="game" width="960" height="600"></canvas>
  <div id="overlay">
    <h1 id="ovTitle"></h1>
    <p id="ovText"></p>
    <div id="ovDiff"><span>난이도</span><div class="dgroup" id="ovDiffBtns"></div></div>
    <button id="ovBtn" type="button"></button>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ===== 기본 설정 =====
  const W = 960, H = 600;
  const MAX_LIVES = 5, MAX_LEVEL = 3;
  const BASE_SPEED = 340;                       // 난이도 '보통', 1단계의 공 속도(px/초)
  const LEVELS = [                              // 단계가 오를수록 공이 빨라짐
    { rows: 4, speed: 340 },
    { rows: 5, speed: 425 },
    { rows: 6, speed: 510 }
  ];
  const DIFFS = [                               // 난이도: 공 속도 배율, 막대 길이
    { name: '쉬움',   mult: 0.8,  paddle: 180 },
    { name: '보통',   mult: 1.0,  paddle: 140 },
    { name: '어려움', mult: 1.25, paddle: 100 }
  ];
  const COLS = 10, MARGIN = 40, GAP = 6, BRICK_H = 44, TOP = 24;
  const BRICK_W = (W - MARGIN * 2 - GAP * (COLS - 1)) / COLS;
  const KINDS = ['cloud', 'bread', 'donut', 'banana'];   // 구름, 식빵, 꽈배기도너츠, 바나나
  const FONT = '"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif';

  const $ = id => document.getElementById(id);
  const canvas = $('game'), ctx = canvas.getContext('2d');
  const stage = $('stage'), hud = $('hud');
  const overlay = $('overlay'), ovTitle = $('ovTitle'), ovText = $('ovText'), ovBtn = $('ovBtn');
  const btnPause = $('btnPause');

  // ===== 상태 =====
  let state = 'title';           // title, ready, playing, paused, levelclear, gameover, win
  let score = 0, lives = 3, level = 1, diff = 1;   // diff: 0 쉬움, 1 보통, 2 어려움
  const paddle = { w: 140, h: 18, x: W / 2 - 70, y: H - 44, speed: 720 };
  const ball = { x: 0, y: 0, r: 10, vx: 0, vy: 0 };
  let bricks = [], remaining = 0;
  let effects = [], notice = null;
  const keys = { left: false, right: false };
  let ovAction = null;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const levelSpeed = () => LEVELS[level - 1].speed * DIFFS[diff].mult;
  const fmtSpeed = v => '×' + (Math.round(v * 100) / 100).toFixed(2).replace(/0$/, '');

  // ===== 화면 크기 맞추기 =====
  function fit() {
    const availW = window.innerWidth - 16;
    const availH = window.innerHeight - hud.offsetHeight - 8 - 16;
    const scale = Math.max(0.2, Math.min(availW / W, availH / H));
    stage.style.width = (W * scale) + 'px';
    stage.style.height = (H * scale) + 'px';
    stage.style.fontSize = (16 * Math.max(scale, 0.5)) + 'px';
    const k = Math.min(3, Math.max(1, scale * (window.devicePixelRatio || 1)));
    canvas.width = Math.round(W * k);
    canvas.height = Math.round(H * k);
    ctx.setTransform(k, 0, 0, k, 0, 0);
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(hud);

  // ===== 상단 정보 =====
  function updateHUD() {
    $('score').textContent = score;
    $('lives').innerHTML = '♥'.repeat(lives) + '<span class="off">' + '♥'.repeat(MAX_LIVES - lives) + '</span>';
    $('level').textContent = level;
    $('speed').textContent = fmtSpeed(levelSpeed() / BASE_SPEED);
    btnPause.textContent = state === 'paused' ? '계속하기' : '일시정지';
  }

  // ===== 난이도 선택 =====
  const diffGroups = [];
  function buildDiffGroup(container) {
    DIFFS.forEach((d, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'dbtn';
      b.textContent = d.name;
      b.dataset.i = i;
      b.addEventListener('click', () => {
        b.blur();
        if (state === 'playing') pauseGame();   // 게임 중에 바꾸면 먼저 멈춰서 공을 놓치지 않게 함
        setDifficulty(i);
      });
      container.appendChild(b);
    });
    diffGroups.push(container);
  }
  function refreshDiffButtons() {
    diffGroups.forEach(g => Array.from(g.children).forEach(b => {
      const on = Number(b.dataset.i) === diff;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    }));
  }
  function setDifficulty(i) {
    diff = i;
    const cx = paddle.x + paddle.w / 2;           // 막대 길이 바꾸기 (가운데 위치 유지)
    paddle.w = DIFFS[i].paddle;
    paddle.x = clamp(cx - paddle.w / 2, 0, W - paddle.w);
    const sp = Math.hypot(ball.vx, ball.vy);      // 날아가는 공의 속도도 바로 맞추기
    if (sp > 0) {
      const k = levelSpeed() / sp;
      ball.vx *= k; ball.vy *= k;
    }
    refreshDiffButtons();
    updateHUD();
  }

  // ===== 안내 화면 =====
  function showOverlay(title, text, btnLabel, action) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovBtn.textContent = btnLabel;
    ovAction = action;
    overlay.classList.remove('hidden');
    updateHUD();
  }
  function hideOverlay() { overlay.classList.add('hidden'); }
  ovBtn.addEventListener('click', () => { ovBtn.blur(); if (ovAction) ovAction(); });

  // ===== 게임 준비 =====
  function buildLevel() {
    const rows = LEVELS[level - 1].rows;
    bricks = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < COLS; c++) {
        bricks.push({
          x: MARGIN + c * (BRICK_W + GAP),
          y: TOP + r * (BRICK_H + GAP),
          kind: KINDS[(r + c) % KINDS.length],     // 구름·식빵·꽈배기·바나나가 비스듬히 번갈아 나옴
          alive: true
        });
      }
    }
    remaining = bricks.length;
    paddle.x = W / 2 - paddle.w / 2;
    effects = [];
    notice = null;
    resetBall();
  }

  function resetBall() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
    ball.vx = 0; ball.vy = 0;
    state = 'ready';
  }

  function startNew() {          // 처리 1, 2
    score = 0; lives = 3; level = 1;
    buildLevel();
    hideOverlay();
    updateHUD();
  }

  function nextLevel() {         // 처리 7-2
    level = Math.min(MAX_LEVEL, level + 1);
    lives = Math.min(MAX_LIVES, lives + 1);
    buildLevel();
    hideOverlay();
    updateHUD();
  }

  // ===== 발사 / 일시정지 =====
  function launch() {            // 처리 3
    if (state !== 'ready') return;
    let deg = Math.random() * 40 - 20;
    if (Math.abs(deg) < 6) deg = deg < 0 ? -6 : 6;
    const a = deg * Math.PI / 180, sp = levelSpeed();
    ball.vx = sp * Math.sin(a);
    ball.vy = -sp * Math.cos(a);
    state = 'playing';
  }
  function pauseGame() {
    if (state !== 'playing') return;
    state = 'paused';
    showOverlay('일시정지', '스페이스 키를 누르거나\n아래 버튼을 눌러 계속해요.', '계속하기', resumeGame);
  }
  function resumeGame() {
    if (state !== 'paused') return;
    state = 'playing';
    hideOverlay();
    updateHUD();
  }
  function spaceAction() {
    if (state === 'ready') launch();
    else if (state === 'playing') pauseGame();
    else if (state === 'paused') resumeGame();
  }
  btnPause.addEventListener('click', () => {
    btnPause.blur();
    if (state === 'playing') pauseGame();
    else if (state === 'paused') resumeGame();
  });
  window.addEventListener('blur', () => { if (state === 'playing') pauseGame(); });

  // ===== 입력: 키보드 =====
  const DIFF_KEYS = { Digit1: 0, Numpad1: 0, Digit2: 1, Numpad2: 1, Digit3: 2, Numpad3: 2 };
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) spaceAction(); return; }
    if (DIFF_KEYS[e.code] !== undefined) { setDifficulty(DIFF_KEYS[e.code]); return; }
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') { keys.left = true; e.preventDefault(); }
    if (e.code === 'ArrowRight' || e.code === 'KeyD') { keys.right = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space') { e.preventDefault(); return; }
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  });

  // ===== 입력: 마우스·터치 (4) =====
  let ptr = null;
  const pointerX = e => {
    const r = canvas.getBoundingClientRect();
    return (e.clientX - r.left) / r.width * W;
  };
  const movePaddleTo = x => { paddle.x = clamp(x - paddle.w / 2, 0, W - paddle.w); };
  canvas.addEventListener('pointerdown', e => {
    if (state !== 'ready' && state !== 'playing') return;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    ptr = { x: e.clientX, y: e.clientY, t: performance.now() };
    movePaddleTo(pointerX(e));
  });
  canvas.addEventListener('pointermove', e => {
    if (state === 'ready' || state === 'playing') movePaddleTo(pointerX(e));
  });
  canvas.addEventListener('pointerup', e => {
    // 살짝 톡 누르면(클릭·탭) 공 발사
    if (ptr && state === 'ready') {
      const moved = Math.hypot(e.clientX - ptr.x, e.clientY - ptr.y);
      if (moved < 15 && performance.now() - ptr.t < 500) launch();
    }
    ptr = null;
  });
  canvas.addEventListener('pointercancel', () => { ptr = null; });

  // ===== 게임 규칙 =====
  function loseLife() {          // 처리 5-3
    lives--;
    if (lives <= 0) {
      lives = 0;
      state = 'gameover';
      showOverlay('게임 끝', `${level}단계에서 끝났어요.\n최종 점수: ${score}점 (난이도: ${DIFFS[diff].name})`, '다시하기', startNew);
    } else {
      notice = { text: '공을 놓쳤어요! 생명이 1개 줄었어요.', t: 2 };
      resetBall();
      updateHUD();
    }
  }

  function finishLevel() {       // 처리 7
    if (level < MAX_LEVEL) {
      state = 'levelclear';
      const bonus = lives < MAX_LIVES ? '\n다음 단계에서 생명이 1개 늘어요!' : '';
      showOverlay(`${level}단계 클리어!`,
        `점수: ${score}점${bonus}\n공이 더 빨라져요!`, '다음 단계', nextLevel);
    } else {
      state = 'win';
      showOverlay('모든 단계 완료!', `축하해요!\n최종 점수: ${score}점 (난이도: ${DIFFS[diff].name})`, '다시하기', startNew);
    }
  }

  function step(h) {
    ball.x += ball.vx * h;
    ball.y += ball.vy * h;

    // 5-1 벽
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    // 5-1 막대 (닿은 위치에 따라 각도가 달라짐)
    if (ball.vy > 0 &&
        ball.y + ball.r >= paddle.y && ball.y <= paddle.y + paddle.h / 2 &&
        ball.x >= paddle.x - ball.r * 0.5 && ball.x <= paddle.x + paddle.w + ball.r * 0.5) {
      const rel = clamp((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
      const a = rel * 65 * Math.PI / 180, sp = levelSpeed();
      ball.vx = sp * Math.sin(a);
      ball.vy = -sp * Math.cos(a);
      ball.y = paddle.y - ball.r;
    }

    // 5-2 벽돌
    for (const b of bricks) {
      if (!b.alive) continue;
      const cx = clamp(ball.x, b.x, b.x + BRICK_W);
      const cy = clamp(ball.y, b.y, b.y + BRICK_H);
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy <= ball.r * ball.r) {
        if (dx === 0 && dy === 0) ball.vy = -ball.vy;
        else if (Math.abs(dx) > Math.abs(dy)) ball.vx = dx > 0 ? Math.abs(ball.vx) : -Math.abs(ball.vx);
        else ball.vy = dy > 0 ? Math.abs(ball.vy) : -Math.abs(ball.vy);
        b.alive = false;
        remaining--;
        score += 10;
        effects.push({ x: b.x + BRICK_W / 2, y: b.y + BRICK_H / 2, t: 0 });
        updateHUD();
        if (remaining === 0) { finishLevel(); return; }
        break;
      }
    }

    // 5-3 바닥
    if (ball.y - ball.r > H) loseLife();
  }

  function update(dt) {
    if (state === 'ready' || state === 'playing') {
      const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      if (dir) paddle.x = clamp(paddle.x + dir * paddle.speed * dt, 0, W - paddle.w);
    }
    if (state === 'ready') {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 1;
    }
    if (state === 'playing') {
      const sp = Math.hypot(ball.vx, ball.vy);
      const n = Math.max(1, Math.ceil(sp * dt / 4));   // 빠른 공이 벽돌을 뚫지 않도록 잘게 나눠 이동
      for (let i = 0; i < n; i++) {
        step(dt / n);
        if (state !== 'playing') break;
      }
    }
    if (state !== 'paused') {
      effects.forEach(f => { f.t += dt; });
      effects = effects.filter(f => f.t < 0.7);
      if (notice) { notice.t -= dt; if (notice.t <= 0) notice = null; }
    }
  }

  // ===== 그리기: 기본 도형 =====
  function rrSub(x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function rr(x, y, w, h, r) { ctx.beginPath(); rrSub(x, y, w, h, r); }

  // 원과 둥근 사각형을 합친 모양의 경로 (g: 테두리 두께만큼 키우거나 줄임)
  function partsPath(parts, g) {
    ctx.beginPath();
    for (const p of parts) {
      if (p.r !== undefined) {
        const rad = Math.max(0.5, p.r + g);
        ctx.moveTo(p.x + rad, p.y);
        ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
      } else {
        rrSub(p.x - g, p.y - g, p.w + 2 * g, p.h + 2 * g, p.rad + g);
      }
    }
  }

  function bigText(text, x, y, size, color) {
    ctx.font = `bold ${size}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 7;
    ctx.strokeStyle = 'rgba(0,0,0,0.65)';
    ctx.strokeText(text, x, y);
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  }

  // ===== 그리기: 벽돌 모양 4가지 =====
  function drawCloud(x, y, w, h) {                       // 구름
    const parts = [
      { x: x + 6, y: y + h * 0.56, w: w - 12, h: h * 0.38, rad: h * 0.19 },
      { x: x + w * 0.22, y: y + h * 0.63, r: h * 0.25 },
      { x: x + w * 0.40, y: y + h * 0.45, r: h * 0.33 },
      { x: x + w * 0.63, y: y + h * 0.40, r: h * 0.37 },
      { x: x + w * 0.80, y: y + h * 0.64, r: h * 0.24 }
    ];
    partsPath(parts, 2); ctx.fillStyle = '#8fb8ff'; ctx.fill();
    partsPath(parts, 0); ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.save();
    partsPath(parts, 0); ctx.clip();
    ctx.fillStyle = '#d6e6ff';
    ctx.fillRect(x, y + h * 0.80, w, h);
    ctx.restore();
  }

  function drawBread(x, y, w, h) {                       // 식빵 한 조각
    const bw = 64, bx = x + (w - bw) / 2;
    const parts = [
      { x: bx, y: y + h * 0.42, w: bw, h: h * 0.56, rad: 8 },
      { x: bx + 17, y: y + h * 0.40, r: h * 0.37 },
      { x: bx + bw - 17, y: y + h * 0.40, r: h * 0.37 }
    ];
    partsPath(parts, 0); ctx.fillStyle = '#c4742a'; ctx.fill();    // 빵 껍질
    partsPath(parts, -4); ctx.fillStyle = '#ffeec2'; ctx.fill();   // 하얀 속살
    ctx.fillStyle = '#f0d08a';
    [[20, 22, 1.8], [32, 29, 1.6], [44, 20, 1.8], [50, 31, 1.6], [26, 35, 1.5], [38, 14, 1.5]]
      .forEach(([dx, dy, r]) => { ctx.beginPath(); ctx.arc(bx + dx, y + dy, r, 0, Math.PI * 2); ctx.fill(); });
  }

  function drawDonut(x, y, w, h) {                       // 꽈배기 도너츠
    const L = x + 11, S = w - 22, cy = y + h / 2, A = h * 0.2;
    const pt = (u, s, dy) => [L + S * u, cy + s * A * Math.cos(3 * Math.PI * u) + (dy || 0)];
    const trace = (s, u0, u1, dy) => {
      ctx.beginPath();
      const N = Math.max(2, Math.round(30 * (u1 - u0)));
      for (let i = 0; i <= N; i++) {
        const p = pt(u0 + (u1 - u0) * i / N, s, dy);
        if (i) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]);
      }
    };
    const rope = (s, u0, u1, cap) => {
      ctx.lineCap = cap; ctx.lineJoin = 'round';
      trace(s, u0, u1, 0);
      ctx.strokeStyle = '#8a4b12'; ctx.lineWidth = 19; ctx.stroke();   // 갈색 테두리
      ctx.strokeStyle = '#e39a3b'; ctx.lineWidth = 15; ctx.stroke();   // 튀김 색
      trace(s, u0, u1, -3);
      ctx.strokeStyle = 'rgba(255,225,160,0.6)'; ctx.lineWidth = 4; ctx.stroke();   // 반짝이는 윗면
    };
    ctx.save();
    rope(-1, 0, 1, 'round');
    rope(1, 0, 1, 'round');
    rope(-1, 1 / 3, 2 / 3, 'butt');            // 가운데에서는 반대쪽 줄이 위로 올라오게 해서 꼬인 모양 만들기
    ctx.fillStyle = '#ffffff';                 // 설탕 알갱이
    [0.06, 0.26, 0.34, 0.60, 0.66, 0.74, 0.94].forEach((u, i) => {
      const p = pt(u, i % 2 ? 1 : -1, -2);
      ctx.beginPath(); ctx.arc(p[0], p[1], 1.7, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();
  }

  function drawBanana(x, y, w, h) {                      // 바나나
    const ax = x + 3, bx = x + w - 3, ty = y + h * 0.09, cx = x + w / 2;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(ax, ty);
    ctx.quadraticCurveTo(cx, y + h * 1.73, bx, ty);      // 바깥쪽 곡선
    ctx.quadraticCurveTo(cx, y + h * 0.955, ax, ty);     // 안쪽 곡선
    ctx.closePath();
    ctx.fillStyle = '#ffe135'; ctx.fill();
    ctx.lineJoin = 'round'; ctx.lineWidth = 3; ctx.strokeStyle = '#b8860b'; ctx.stroke();
    ctx.beginPath();                                      // 바나나 옆 줄무늬
    ctx.moveTo(ax + 8, ty + 3);
    ctx.quadraticCurveTo(cx, y + h * 1.34, bx - 8, ty + 3);
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(184,134,11,0.5)'; ctx.stroke();
    ctx.fillStyle = '#6b4a1b';                            // 꼭지와 끝부분
    ctx.beginPath(); ctx.arc(ax, ty, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(bx, ty, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  const DRAWERS = { cloud: drawCloud, bread: drawBread, donut: drawDonut, banana: drawBanana };

  // ===== 그리기: 화면 전체 =====
  function draw() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#16215a');
    g.addColorStop(1, '#0a1230');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    for (const b of bricks) {
      if (!b.alive) continue;
      rr(b.x, b.y, BRICK_W, BRICK_H, 8);                 // 벽돌이 닿는 범위를 은은하게 표시
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.fill();
      DRAWERS[b.kind](b.x, b.y, BRICK_W, BRICK_H);
    }

    // 막대
    const pg = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    pg.addColorStop(0, '#9fe0ff');
    pg.addColorStop(1, '#3a7bff');
    rr(paddle.x, paddle.y, paddle.w, paddle.h, 9);
    ctx.fillStyle = pg;
    ctx.fill();

    // 공
    ctx.save();
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.restore();

    // +10 효과
    for (const f of effects) {
      ctx.globalAlpha = 1 - f.t / 0.7;
      bigText('+10', f.x, f.y - f.t * 40, 30, '#ffe14d');
    }
    ctx.globalAlpha = 1;

    if (notice) bigText(notice.text, W / 2, H * 0.6, 38, '#ffd1d1');
    if (state === 'ready') {
      if (Math.floor(performance.now() / 500) % 2 === 0 || notice) {
        bigText('스페이스 키 또는 화면 터치로 발사!', W / 2, H * 0.74, 34, '#ffffff');
      }
    }
  }

  // ===== 반복 (6) =====
  let last = performance.now();
  function loop(t) {
    const dt = Math.min((t - last) / 1000, 0.033);
    last = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // ===== 시작 =====
  buildDiffGroup($('hudDiff'));
  buildDiffGroup($('ovDiffBtns'));
  setDifficulty(1);
  buildLevel();
  state = 'title';
  fit();
  showOverlay('벽돌깨기',
    '공으로 벽돌을 모두 깨 보세요!\n← → 키, 마우스, 터치로 막대 움직이기\n스페이스 키 또는 화면 터치로 공 발사·일시정지\n난이도는 아래 버튼이나 1·2·3 키로 바꿔요',
    '시작하기', startNew);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
